name: Sunset Harbor V3 FINAL — integrated cinematic render
on:
  push:
    branches: [integration/sunset-harbor-v3-final]
  workflow_dispatch:
jobs:
  render-final:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion dependencies
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Native Remotion render of integrated V3 art, motion and user-provided music
        run: node scripts/render-v3-final.mjs
      - name: Verify movie, music, frame captures and full decode
        run: |
          test -s out/sunset-harbor-v3-FINAL-1080p.mp4
          ffprobe -v error -count_frames -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,nb_read_frames:format=duration -of json out/sunset-harbor-v3-FINAL-1080p.mp4
          ffmpeg -v error -i out/sunset-harbor-v3-FINAL-1080p.mp4 -f null -
          test -s out/qa/v3-final-opening.png
          test -s out/qa/v3-final-middle.png
          test -s out/qa/v3-final-ending.png
      - name: Upload verified final MP4
        uses: actions/upload-artifact@v4
        with:
          name: sunset-harbor-v3-FINAL-cinematic-1080p
          path: |
            out/sunset-harbor-v3-FINAL-1080p.mp4
            out/qa/v3-final-opening.png
            out/qa/v3-final-middle.png
            out/qa/v3-final-ending.png
            out/qa/v3-final-verification.json
          if-no-files-found: error
          retention-days: 30
