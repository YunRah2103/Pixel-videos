name: Pixel Garage - Godot 2.5D isolated experiment

on:
  workflow_dispatch:
  push:
    branches: [experiment/pixel-garage-godot-25d]
    paths:
      - 'experiments/pixel-garage-godot-25d/art/**'
      - 'experiments/pixel-garage-godot-25d/godot/Main.gd'
      - 'experiments/pixel-garage-godot-25d/godot/Main.tscn'
      - 'experiments/pixel-garage-godot-25d/godot/project.godot'
      - 'experiments/pixel-garage-godot-25d/tools/**'
      - '.github/workflows/render-godot-25d.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 unzip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Download official Godot 4.4.1 binary
        run: |
          curl -fLSs --retry 4 --retry-delay 3 'https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Generate original 2D sprites / scene assets
        working-directory: experiments/pixel-garage-godot-25d
        run: python art/make_assets.py
      - name: Render actual Godot Movie Writer frames and mux finished MP4
        working-directory: experiments/pixel-garage-godot-25d
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: bash tools/render.sh
      - name: Extract Godot frame inspections
        working-directory: experiments/pixel-garage-godot-25d
        run: |
          mkdir -p output/stills
          for t in 1 4 8 11 14; do
            ffmpeg -v error -y -ss "$t" -i output/pixel-garage-rally-25d.mp4 -frames:v 1 "output/stills/shot-${t}s.png"
          done
      - name: Publish reproducible generated sprites to isolated experimental branch
        run: |
          git config user.name 'pixel-garage-ci[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/pixel-garage-godot-25d/godot/assets
          if ! git diff --cached --quiet; then
            git commit -m 'art: publish original rally sprites and pixel environment assets'
            git push origin HEAD:experiment/pixel-garage-godot-25d
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-garage-godot-25d-output
          path: |
            experiments/pixel-garage-godot-25d/output/pixel-garage-rally-25d.mp4
            experiments/pixel-garage-godot-25d/output/stills/
            experiments/pixel-garage-godot-25d/output/soundtrack.wav
          if-no-files-found: warn
          retention-days: 30