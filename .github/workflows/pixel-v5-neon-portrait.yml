name: Pixel Studio V5 — portrait art-first motion test
on:
  push:
    branches: [feat/pixel-studio-v5-neon-portrait-art-pass]
    paths:
      - 'scripts/render_neon_portrait.py'
      - 'scripts/v5_pedestrian.py'
      - 'scripts/v5_reflections.py'
      - 'scripts/v5_streamline_tram.py'
      - 'studio/v5/neon-portrait.tmx'
      - '.github/workflows/pixel-v5-neon-portrait.yml'
  pull_request:
    paths:
      - 'scripts/render_neon_portrait.py'
      - 'scripts/v5_pedestrian.py'
      - 'scripts/v5_reflections.py'
      - 'scripts/v5_streamline_tram.py'
      - '.github/workflows/pixel-v5-neon-portrait.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portrait-art-and-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install completely free render tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil tiled xvfb
          python3 -m py_compile scripts/render_neon_portrait.py scripts/v5_pedestrian.py scripts/v5_reflections.py scripts/v5_streamline_tram.py
      - name: Fetch original artist layered assets, preserving CC BY source and provenance
        run: |
          python3 scripts/setup_free_pixel_v5.py --art
          test -s .tools/pixel-v5/art/ansimuz_cyberpunk/ASSET_PROVENANCE.json
      - name: Export actual authored storyboard through free Tiled CLI
        run: |
          mkdir -p out/pixel-v5-portrait
          xvfb-run -a tiled --export-map studio/v5/neon-portrait.tmx out/pixel-v5-portrait/tiled-layout.json
          test -s out/pixel-v5-portrait/tiled-layout.json
          python3 - <<'PY'
          import json
          data=json.load(open('out/pixel-v5-portrait/tiled-layout.json'))
          objects=[obj['name'] for layer in data['layers'] for obj in layer.get('objects',[])]
          assert {'tram-start','tram-finish','open-sign','pedestrian-start','pedestrian-stop'} <= set(objects), objects
          print('TILED_EXPORTED_REAL_MAP',objects)
          PY
      - name: Render a 5s portrait video from independent native-pixel art and trolley cels
        run: |
          /usr/bin/python3 scripts/render_neon_portrait.py
          ffmpeg -v error -xerror -i out/pixel-v5-portrait/pixel-v5-neon-portrait-5s.mp4 -f null -
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=width,height,nb_read_frames,r_frame_rate -of json out/pixel-v5-portrait/pixel-v5-neon-portrait-5s.mp4
          test -s out/pixel-v5-portrait/contact-sheet.png
          test -s out/pixel-v5-portrait/hero-still.png
          test "$(find out/pixel-v5-portrait -maxdepth 1 -name 'trolley-cel-*.png' | wc -l)" -eq 8
          test -s out/pixel-v5-portrait/render-qa.json
          python3 - <<'PY'
          import json
          qa=json.load(open('out/pixel-v5-portrait/render-qa.json'))
          assert qa.get('original_sprite_cels') == 8, 'New eight-frame trolley not used'
          assert qa.get('native_puddle_reflections'), 'Missing sprite-linked wet-road composition evidence'
          assert len(qa.get('original_directed_pixel_lights',[]))==3
          print('NATIVE_REFLECTIONS_AND_REAL_MOVING_LIGHTS',qa['native_puddle_reflections'])
          PY
      - name: Publish the real five-second MP4, source sprites and review contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: pixel-v5-neon-portrait-five-second-proof
          path: |
            out/pixel-v5-portrait/pixel-v5-neon-portrait-5s.mp4
            out/pixel-v5-portrait/preview-still.png
            out/pixel-v5-portrait/hero-still.png
            out/pixel-v5-portrait/contact-sheet.png
            out/pixel-v5-portrait/trolley-cel-*.png
            out/pixel-v5-portrait/pedestrian-cel-*.png
            out/pixel-v5-portrait/pedestrian-reveal-cel.png
            out/pixel-v5-portrait/render-qa.json
            out/pixel-v5-portrait/ATTRIBUTION.txt
            out/pixel-v5-portrait/tiled-layout.json
            studio/v5/neon-portrait.tmx
          retention-days: 30
          if-no-files-found: error
