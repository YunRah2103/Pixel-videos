name: Pixel Garage — Angled 2.5D true perspective test
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/pixel-garage-perspective-depth-v2
    paths:
      - 'experiments/pixel-garage-depth-angle-v2/**'
      - '.github/workflows/pixel-garage-depth-angle-v2.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot software GL renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip xvfb libgl1 libgl1-mesa-dri mesa-utils python3-pil python3-numpy
          wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.2-stable_linux.x86_64
      - name: Generate original 2D hand-authored assets and audio
        run: |
          cd experiments/pixel-garage-depth-angle-v2
          /usr/bin/python3 build_art.py
          /usr/bin/python3 build_audio.py
      - name: Render movie directly in Godot
        run: |
          cd experiments/pixel-garage-depth-angle-v2
          /tmp/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --editor --import --quit
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a /tmp/godot/Godot_v4.5.2-stable_linux.x86_64 --rendering-method gl_compatibility --path . --write-movie original_godot.avi --resolution 360x640 --fixed-fps 30 --quit-after 240
      - name: Encode, audit duration and sample screenshots
        run: |
          cd experiments/pixel-garage-depth-angle-v2
          ffmpeg -hide_banner -loglevel error -y -i original_godot.avi -i sound.wav -vf 'scale=1080:1920:flags=neighbor' -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -c:a aac -b:a 160k -shortest pixel-garage-real-25d-v2.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate,nb_frames -of json pixel-garage-real-25d-v2.mp4 > verified-probe.json
          ffmpeg -hide_banner -loglevel error -y -ss 0.5 -i pixel-garage-real-25d-v2.mp4 -frames:v 1 still-0.png
          ffmpeg -hide_banner -loglevel error -y -ss 3.5 -i pixel-garage-real-25d-v2.mp4 -frames:v 1 still-3.png
          ffmpeg -hide_banner -loglevel error -y -ss 7.0 -i pixel-garage-real-25d-v2.mp4 -frames:v 1 still-7.png
          test "$(ffprobe -v error -select_streams v -show_entries stream=width -of csv=p=0 pixel-garage-real-25d-v2.mp4)" = 1080
          test "$(ffprobe -v error -select_streams v -show_entries stream=r_frame_rate -of csv=p=0 pixel-garage-real-25d-v2.mp4)" = 30/1
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-garage-real-perspective-v2
          path: |
            experiments/pixel-garage-depth-angle-v2/pixel-garage-real-25d-v2.mp4
            experiments/pixel-garage-depth-angle-v2/verified-probe.json
            experiments/pixel-garage-depth-angle-v2/still-*.png
          retention-days: 15
