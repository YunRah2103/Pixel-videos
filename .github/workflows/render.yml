name: Render pixel-art demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/render.mjs'
      - 'package.json'
      - '.github/workflows/render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render with Remotion and upscale with nearest neighbour
        run: npm run render
      - name: Verify video
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_frames -of default=noprint_wrappers=1 out/sunset-harbor-1080p.mp4
          test -s out/sunset-harbor-1080p.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-studio-sunset-harbor
          path: out/sunset-harbor-1080p.mp4
