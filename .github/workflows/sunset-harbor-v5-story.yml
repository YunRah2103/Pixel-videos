name: Sunset Harbor V5 — Agent 3 character movie proof
on:
  push:
    branches:
      - agent/sunset-harbor-v5-animation
    paths:
      - 'src/scenes/v5/**'
      - 'scripts/render-v5-story.mjs'
      - '.github/workflows/sunset-harbor-v5-story.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - integration/sunset-harbor-v4-final
jobs:
  moving-character-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion and native codecs
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
      - name: Render 12-second film and validate every decoded frame and audio
        run: node scripts/render-v5-story.mjs
      - name: Check proof movie, nine frames, close-ups, actual V4 comparison
        run: |
          test -s out/sunset-harbor-v5-AGENT3-1080p.mp4
          test -s out/v5-story-qa/contact-sheet.png
          test -s out/v5-story-qa/v4-v5-comparison.png
          test -s out/v5-story-qa/verification.json
          test -s out/v5-story-qa/crop-arrival.png
          test -s out/v5-story-qa/crop-handhold.png
          test -s out/v5-story-qa/crop-yacht.png
          test "$(find out/v5-story-qa -name 'frame-*.png' | wc -l)" = "9"
          ffprobe -v error -count_frames -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,nb_read_frames:format=duration -of json out/sunset-harbor-v5-AGENT3-1080p.mp4
          ffmpeg -v error -xerror -i out/sunset-harbor-v5-AGENT3-1080p.mp4 -f null -
      - name: Upload playable soundtrack movie and contact-sheet visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: sunset-harbor-v5-agent3-verified-story
          path: |
            out/sunset-harbor-v5-AGENT3-1080p.mp4
            out/v5-story-qa/
          if-no-files-found: error
          retention-days: 30
