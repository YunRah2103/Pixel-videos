name: GPT56 Five Car 2D Pixel Benchmark

on:
  pull_request:
    branches:
      - integration/countryside-drive-v3-final
  workflow_dispatch:

jobs:
  render-five:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow and FFmpeg
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render and verify five films
        run: python experiments/gpt56-five-car-benchmark/render_five.py
      - name: Summarize outputs
        run: |
          ls -lh out/gpt56-five-car-benchmark
          cat out/gpt56-five-car-benchmark/qa.json
      - name: Upload five MP4s and QA
        uses: actions/upload-artifact@v4
        with:
          name: gpt56-five-car-2d-pixel-benchmark
          path: |
            out/gpt56-five-car-benchmark/*.mp4
            out/gpt56-five-car-benchmark/*-contact.png
            out/gpt56-five-car-benchmark/qa.json
          if-no-files-found: error
          retention-days: 14
